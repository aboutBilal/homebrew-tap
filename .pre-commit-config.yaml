# Block secrets before they become commits, with Spillkit's own hooks.
# Install once per clone:   pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/aboutBilal/spillkit
    rev: v3.8.0
    hooks:
      - id: forbid-secret-files # .env, keys and state files, whatever their content
      - id: leak-guard          # gitleaks on the staged changes
